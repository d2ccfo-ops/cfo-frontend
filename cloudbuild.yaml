# The frontend needs a build config rather than `gcloud builds submit --tag`
# because that shorthand cannot pass --build-arg, and this image has two
# required build args: NEXT_PUBLIC_API_URL and NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY.
# They are baked into the client bundle by `next build` and cannot be supplied
# at deploy time. See the Dockerfile's header for why.
#
# Both substitutions below are public values — a Clerk publishable key is meant
# to ship in a browser bundle, and the API URL is visible in every network
# request. Nothing secret is passed here; CLERK_SECRET_KEY is a runtime secret
# and is attached by `gcloud run deploy --set-secrets`, never built in.
#
#   gcloud builds submit cfo-frontend \
#     --config=cfo-frontend/cloudbuild.yaml \
#     --substitutions=_IMAGE=asia-south1-docker.pkg.dev/d2c-cfo/cfoos/frontend:v1,_API_URL=https://...,_CLERK_PK=pk_test_...

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_CLERK_PK}
      - --tag=${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  # The Next build is memory-hungry; the default 1-vCPU worker is where
  # "JavaScript heap out of memory" comes from on a project this size.
  machineType: E2_HIGHCPU_8

timeout: 1200s
